# Two processes, one host: MediaMTX terminates the browser's WHIP publish, and
# the relay spawns an ffmpeg per session that pushes RTSP → RTMP(S) at the
# provider. The API server talks only to the control API on :8080.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # WHIP: where the browser publishes.
      - "8889:8889"
      # WebRTC media.
      - "8189:8189/udp"
    # RTSP (8554) and the API (9997) are intentionally not published.

  relay:
    build: .
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      # Public https origin of the WHIP endpoint, e.g. https://relay.example.com
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:?set PUBLIC_RELAY_URL}
      # Must match MEDIA_RELAY_TOKEN in the S.M.U.V.E API environment.
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-360}
      # Self-test target: the MediaMTX RTMP listener inside this network. Point
      # it at a provider ingest (Twitch with ?bandwidthtest=true) to prove
      # egress to the platform instead.
      SELFTEST_RTMP_URL: ${SELFTEST_RTMP_URL:-rtmp://mediamtx:1935/selftest}
      SELFTEST_STREAM_KEY: ${SELFTEST_STREAM_KEY:-selftest}
      # Session recovery: keep in-flight pushes across a relay restart. The
      # state file holds stream keys, so it is encrypted with RELAY_STATE_KEY.
      RELAY_STATE_FILE: /var/lib/relay/sessions.json
      RELAY_STATE_KEY: ${RELAY_STATE_KEY:-}
      # Alert when a live session stops sending to the provider.
      EGRESS_STALL_SECONDS: ${EGRESS_STALL_SECONDS:-15}
      # After this much silence the relay restarts ffmpeg itself, up to
      # EGRESS_MAX_RECOVERIES times. 0 keeps it report-only.
      EGRESS_RECOVER_AFTER_SECONDS: ${EGRESS_RECOVER_AFTER_SECONDS:-45}
      EGRESS_MAX_RECOVERIES: ${EGRESS_MAX_RECOVERIES:-2}
      # Egress audio. The browser sends Opus, which FLV cannot carry, so the
      # relay re-encodes it to AAC at this bitrate and channel count.
      EGRESS_AUDIO_BITRATE: ${EGRESS_AUDIO_BITRATE:-128k}
      EGRESS_AUDIO_CHANNELS: ${EGRESS_AUDIO_CHANNELS:-2}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      FFMPEG_PATH: ffmpeg
    volumes:
      - relay-state:/var/lib/relay
    ports:
      # Control API: reachable by the S.M.U.V.E API only. Put it behind TLS or
      # a private network; it can open sessions with provider keys.
      - "8080:8080"

volumes:
  relay-state:
