<div class="rack-container glass-v42 shadow-v42-xl h-full flex flex-col">
  <div
    class="rack-header wood-panel flex items-center justify-between px-4 border-b border-fl-border"
  >
    <div class="rack-title neon-text text-[10px] font-black tracking-widest">
      CHANNEL RACK
    </div>
    <div class="relative">
      <button
        type="button"
        (click)="addTrackOpen.set(!addTrackOpen())"
        aria-haspopup="menu"
        [attr.aria-expanded]="addTrackOpen()"
        aria-label="Add a new channel"
        class="executive-glass text-[9px] px-3 py-1.5 rounded-lg border border-white/10 hover:border-neon-orange/50 transition-all"
      >
        + ADD CHANNEL
      </button>
      <div
        *ngIf="addTrackOpen()"
        class="add-flyout absolute right-0 mt-1 z-30 rounded-xl border border-white/10 bg-black/90 backdrop-blur p-2 max-h-64 overflow-y-auto w-56"
        role="menu"
        aria-label="Instrument picker for new channel"
      >
        <div *ngFor="let category of instrumentCategories" class="mb-2">
          <div
            class="text-[7px] font-black tracking-widest uppercase opacity-40 mb-1"
          >
            {{ category }}
          </div>
          <button
            type="button"
            *ngFor="let preset of presetsByCategory(category)"
            (click)="addTrack(preset.id)"
            class="w-full text-left px-2 py-1.5 rounded-lg text-[10px] font-bold hover:bg-white/10 transition-all flex items-center justify-between gap-2"
            role="menuitem"
          >
            <span class="truncate">{{ preset.name }}</span>
            <span class="text-[7px] opacity-40 uppercase">{{
              preset.type
            }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="channel-list flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
    <div
      *ngFor="let track of tracks(); let i = index"
      class="channel-item glass-v42 flex items-center p-3 gap-3 rounded-xl border border-white/5 hover:border-white/10 transition-all cursor-pointer group relative overflow-hidden"
      [class.selected]="selectedTrackId() === track.id"
      (click)="selectTrack(track)"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
    >
      <div
        class="absolute inset-0 bg-gradient-to-r from-transparent to-white/[0.02] pointer-events-none"
      ></div>

      <!-- Mute/Solo LED Controls -->
      <div class="flex flex-col gap-1.5">
        <button
          type="button"
          (click)="toggleMute(track); $event.stopPropagation()"
          class="w-3.5 h-3.5 rounded-sm transition-all border border-black/40 shadow-inner"
          [class.muted]="track.muted"
          [style.background-color]="track.muted ? '#ef4444' : '#1a1a24'"
          [attr.aria-label]="'Mute ' + track.name"
          [attr.aria-pressed]="track.muted"
          title="Mute"
        ></button>
        <button
          type="button"
          (click)="toggleSolo(track); $event.stopPropagation()"
          class="w-3.5 h-3.5 rounded-sm transition-all border border-black/40 shadow-inner"
          [class.soloed]="track.soloed"
          [style.background-color]="track.soloed ? '#fbbf24' : '#1a1a24'"
          [attr.aria-label]="'Solo ' + track.name"
          [attr.aria-pressed]="track.soloed"
          title="Solo"
        ></button>
      </div>

      <!-- Controls (Vol/Pan) -->
      <div class="flex flex-col gap-2 w-14">
        <div class="flex items-center gap-1.5">
          <span class="text-[7px] font-black font-mono opacity-40">VOL</span>
          <input
            type="range"
            min="0"
            max="1.5"
            step="0.01"
            [ngModel]="track.gain"
            (ngModelChange)="updateVolume(track, $event)"
            class="rack-fader-pro"
            (click)="$event.stopPropagation()"
            [attr.aria-label]="'Volume for ' + track.name"
          />
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[7px] font-black font-mono opacity-40">PAN</span>
          <input
            type="range"
            min="-1"
            max="1"
            step="0.1"
            [ngModel]="track.pan"
            (ngModelChange)="updatePan(track, $event)"
            class="rack-fader-pro"
            (click)="$event.stopPropagation()"
            [attr.aria-label]="'Pan for ' + track.name"
          />
        </div>
      </div>

      <!-- Track label + instrument picker -->
      <div class="flex-1 min-w-0">
        <div
          class="channel-name neon-text-sm truncate uppercase tracking-tight font-black leading-none mb-1 flex items-center gap-1"
        >
          <span class="truncate">{{ track.name }}</span>
          <button
            type="button"
            (click)="openPianoRoll(track); $event.stopPropagation()"
            [attr.aria-label]="'Open Piano Roll for ' + track.name"
            class="ml-1 opacity-0 group-hover:opacity-40 hover:!opacity-100 focus:!opacity-100 transition-all text-fl-blue"
            title="Open in Piano Roll"
          >
            <span class="material-symbols-outlined text-[12px]">piano</span>
          </button>
        </div>
        <button
          type="button"
          class="text-[7px] font-mono truncate uppercase tracking-widest text-left opacity-30 hover:opacity-80 transition-all flex items-center gap-1"
          (click)="toggleInstrumentPicker(track.id); $event.stopPropagation()"
          [attr.aria-haspopup]="'menu'"
          [attr.aria-expanded]="instrumentPickerTrackId() === track.id"
          [attr.aria-label]="'Change instrument for ' + track.name"
          [title]="'Instrument: ' + instrumentName(track.instrumentId) + ' — click to change'"
        >
          <span class="material-symbols-outlined text-[10px]">tune</span>
          {{ instrumentName(track.instrumentId) }}
        </button>
        <!-- Per-channel instrument fly-out -->
        <div
          *ngIf="instrumentPickerTrackId() === track.id"
          class="instrument-flyout absolute left-16 top-10 z-30 rounded-xl border border-white/10 bg-black/90 backdrop-blur p-2 max-h-64 overflow-y-auto w-56"
          role="menu"
          [attr.aria-label]="'Pick an instrument for ' + track.name"
          (click)="$event.stopPropagation()"
        >
          <div *ngFor="let category of instrumentCategories" class="mb-2">
            <div
              class="text-[7px] font-black tracking-widest uppercase opacity-40 mb-1"
            >
              {{ category }}
            </div>
            <button
              type="button"
              *ngFor="let preset of presetsByCategory(category)"
              (click)="setInstrument(track, preset.id)"
              class="w-full text-left px-2 py-1.5 rounded-lg text-[10px] font-bold hover:bg-white/10 transition-all flex items-center justify-between gap-2"
              [class.bg-teal-500\/20]="track.instrumentId === preset.id"
              role="menuitemradio"
              [attr.aria-checked]="track.instrumentId === preset.id"
            >
              <span class="truncate">{{ preset.name }}</span>
              <span
                *ngIf="track.instrumentId === preset.id"
                class="material-symbols-outlined text-[11px] text-teal-400"
                >check</span
              >
            </button>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div
        class="flex items-center gap-1 ml-2 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-all"
        role="group"
        [attr.aria-label]="track.name + ' quick actions'"
      >
        <button
          type="button"
          (click)="cloneTrack(track); $event.stopPropagation()"
          [attr.aria-label]="'Clone ' + track.name + ' with its pattern'"
          class="text-[10px] text-slate-500 hover:text-white"
          title="Clone (deep copy with pattern)"
        >
          <span class="material-symbols-outlined text-[12px]"
            >content_copy</span
          >
        </button>
        <div class="flex flex-col">
          <button
            type="button"
            (click)="reorderTrack(i, 'up'); $event.stopPropagation()"
            [attr.aria-label]="'Move ' + track.name + ' up'"
            [disabled]="i === 0"
            class="text-[8px] text-slate-500 hover:text-white disabled:opacity-20"
          >
            <span class="material-symbols-outlined text-[10px]"
              >expand_less</span
            >
          </button>
          <button
            type="button"
            (click)="reorderTrack(i, 'down'); $event.stopPropagation()"
            [attr.aria-label]="'Move ' + track.name + ' down'"
            [disabled]="i === tracks().length - 1"
            class="text-[8px] text-slate-500 hover:text-white disabled:opacity-20"
          >
            <span class="material-symbols-outlined text-[10px]"
              >expand_more</span
            >
          </button>
        </div>
        <button
          type="button"
          (click)="removeTrack(track.id); $event.stopPropagation()"
          [attr.aria-label]="'Delete ' + track.name"
          class="text-[10px] text-red-900 hover:text-red-500"
          title="Delete channel"
        >
          <span class="material-symbols-outlined text-[12px]">delete</span>
        </button>
      </div>

      <!-- Live 16-step lane — audible pattern editing per 16-step bar window.
           Drum-type lanes are pad rows in the Drum Machine, so the melodic
           step lane still only renders for midi tracks; drum tracks instead
           show a hint chip that deep-links to the kit. -->
      <div
        class="flex flex-col items-end gap-1"
        *ngIf="track.type === 'midi' || track.type === 'drum'"
        [attr.aria-label]="track.name + ' step sequencer'"
      >
        <!-- Bar window pager -->
        <div class="flex items-center gap-1" role="group" aria-label="Pattern bar">
          <button
            type="button"
            (click)="nudgeBar(-1); $event.stopPropagation()"
            class="w-4 h-4 rounded bg-black/30 text-white/50 hover:text-white text-[9px] leading-none"
            [attr.aria-label]="'Previous bar'"
            [disabled]="stepWindowBar() === 0"
          >‹</button>
          <button
            type="button"
            *ngFor="let bar of barLabels(track)"
            (click)="setBar(track, bar); $event.stopPropagation()"
            class="px-1 h-4 rounded text-[7px] font-black tracking-wider transition-all"
            [class.bar-active]="stepWindowBar() === bar"
            [attr.aria-label]="'Edit bar ' + (bar + 1)"
            [attr.aria-pressed]="stepWindowBar() === bar"
          >{{ bar + 1 }}</button>
          <button
            type="button"
            (click)="nudgeBar(1); $event.stopPropagation()"
            class="w-4 h-4 rounded bg-black/30 text-white/50 hover:text-white text-[9px] leading-none"
            [attr.aria-label]="'Next bar'"
          >›</button>
        </div>

        <div
          class="flex gap-1 items-center bg-black/20 p-1.5 rounded-lg border border-white/5"
          role="group"
          [attr.aria-label]="
            track.name + ' steps, bar ' + (stepWindowBar() + 1)
          "
        >
          <div
            *ngFor="let step of laneSteps; let sIdx = index"
            class="w-2.5 h-7 rounded-sm transition-all shadow-lg cursor-crosshair"
            [class.active]="cellLit(track, sIdx)"
            [class.current-step]="cellNow(sIdx)"
            [style.background-color]="
              cellLit(track, sIdx)
                ? track.color
                : sIdx % 8 < 4
                  ? 'rgba(255,255,255,0.06)'
                  : 'rgba(255,255,255,0.02)'
            "
            (click)="toggleStepCell(track, sIdx); $event.stopPropagation()"
            (keydown.enter)="toggleStepCell(track, sIdx); $event.stopPropagation()"
            (keydown.space)="
              $event.preventDefault();
              toggleStepCell(track, sIdx);
              $event.stopPropagation()
            "
            tabindex="0"
            role="button"
            [attr.aria-label]="
              track.name +
              ' step ' +
              (stepWindowBar() * 16 + sIdx + 1) +
              ' of pattern · ' +
              (cellLit(track, sIdx) ? 'active' : 'empty') +
              (cellNow(sIdx) ? ' · currently playing' : '')
            "
            [attr.aria-pressed]="cellLit(track, sIdx)"
          ></div>
        </div>
      </div>
    </div>
  </div>
</div>
