<div
  class="sound-pad"
  [class.active]="active"
  [style.--pad-color]="color"
  (click)="triggerPad()"
  (pointerdown)="onPointerDown()"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (pointerleave)="onPointerUp()"
  (contextmenu)="onContextMenu($event)"
>
  <span class="sp-label">{{ name }}</span>
</div>
