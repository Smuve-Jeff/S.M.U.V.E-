<aside
  class="studio-inspector"
  [class.studio-inspector-collapsed]="!open"
  [attr.aria-label]="title"
>
  <header class="studio-inspector-header">
    <div>
      <span *ngIf="eyebrow" class="studio-inspector-eyebrow">{{ eyebrow }}</span>
      <h2>{{ title }}</h2>
    </div>
    <button
      *ngIf="collapsible"
      type="button"
      class="studio-inspector-toggle"
      (click)="toggle()"
      [attr.aria-expanded]="open"
      [attr.aria-label]="open ? 'Collapse inspector' : 'Expand inspector'"
    >
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ open ? 'right_panel_close' : 'right_panel_open' }}
      </span>
    </button>
  </header>
  <div *ngIf="open" class="studio-inspector-body">
    <ng-content></ng-content>
  </div>
</aside>
