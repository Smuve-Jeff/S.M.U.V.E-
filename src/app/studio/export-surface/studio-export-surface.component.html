<div class="export-surface-shell">
  <div class="export-options" role="group" aria-label="Export options">
    <label class="export-field">
      <span>Format</span>
      <select
        [value]="format()"
        (change)="setFormat($event)"
        [disabled]="busy()"
      >
        <option *ngFor="let entry of formats" [value]="entry.id">
          {{ entry.label }}
        </option>
      </select>
    </label>

    <label class="export-field">
      <span>Sample rate</span>
      <select
        [value]="sampleRate()"
        (change)="setSampleRate($event)"
        [disabled]="busy()"
      >
        <option *ngFor="let rate of sampleRates" [value]="rate">
          {{ rateLabel(rate) }}
        </option>
      </select>
    </label>

    <label class="export-field">
      <span>Stem depth</span>
      <select
        [value]="stemBitDepth()"
        (change)="setStemBitDepth($event)"
        [disabled]="busy()"
      >
        <option [value]="16">16-bit</option>
        <option [value]="24">24-bit</option>
      </select>
    </label>
  </div>

  <!-- Delivery presets: a saved format/rate/depth triplet. -->
  <div class="export-presets" role="group" aria-label="Export presets">
    <div class="export-preset-save">
      <input
        type="text"
        maxlength="48"
        placeholder="Preset name (e.g. Streaming master)"
        [value]="presetName()"
        (input)="setPresetName($any($event.target).value)"
        [disabled]="busy()"
        aria-label="Export preset name"
      />
      <button type="button" (click)="savePreset()" [disabled]="busy()">
        Save preset
      </button>
    </div>

    <div class="export-preset-list" *ngIf="presets().length > 0">
      <div class="export-preset-row" *ngFor="let preset of presets()">
        <button
          type="button"
          class="export-preset-apply"
          (click)="applyPreset(preset)"
          [disabled]="busy()"
          [attr.aria-label]="'Apply export preset ' + preset.name"
        >
          <span class="export-preset-name">{{ preset.name }}</span>
          <span class="export-preset-meta">
            {{ preset.format | uppercase }} ·
            {{ rateLabel(preset.sampleRate) }} · {{ preset.stemBitDepth }}-bit
          </span>
        </button>
        <button
          type="button"
          class="export-preset-remove"
          (click)="deletePreset(preset.id)"
          [attr.aria-label]="'Delete export preset ' + preset.name"
        >
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </div>
    </div>
    <p class="export-preset-hint" *ngIf="presets().length === 0">
      Save the format, rate and stem depth you deliver with, then reapply it in
      one tap.
    </p>
  </div>

  <div class="export-actions">
    <button
      type="button"
      class="primary"
      (click)="exportMixdown()"
      [disabled]="busy()"
    >
      Export Mixdown ({{ formatLabel() }})
    </button>
    <button type="button" (click)="exportStems()" [disabled]="busy()">
      Export Stems
    </button>
    <button type="button" (click)="exportProject()" [disabled]="busy()">
      Export Project
    </button>
    <button type="button" (click)="exportMidi()" [disabled]="busy()">
      Export MIDI
    </button>
    <button
      type="button"
      (click)="exportDawproject()"
      [disabled]="busy()"
      title="Open exchange project for Bitwig, Studio One and Cubasis 3.7+"
    >
      Export DAWproject
    </button>
    <button type="button" (click)="shareExport()" [disabled]="busy()">
      Share Mixdown
    </button>
  </div>

  <div class="export-progress" *ngIf="busy()" role="status" aria-live="polite">
    <div class="export-progress-head">
      <span>{{ status() }}</span>
      <span *ngIf="progress() !== null">{{ progress() }}%</span>
    </div>
    <div
      class="export-progress-track"
      [class.indeterminate]="progress() === null"
    >
      <span
        class="export-progress-fill"
        [style.width.%]="progress() === null ? 100 : progress()"
      ></span>
    </div>
  </div>

  <p
    class="export-feedback"
    *ngIf="feedback() as result"
    [class.error]="result.tone === 'error'"
    role="status"
  >
    {{ result.text }}
  </p>
</div>
