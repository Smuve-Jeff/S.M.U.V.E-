      >
        <app-chatbot (close)="uiService.toggleChatbot()"></app-chatbot>
      </aside>
    </main>

    <footer
      *ngIf="!isFullPageMode() && !isMobile() && !isAuthRoute()"
      class="h-8 glass-v42 border-t border-border flex items-center justify-center px-10"
    >
      <span class="app-footer-brand footer-brand-global">©️ Smuve Jeff Presents</span>
    </footer>
  </div>

  <div
    *ngIf="!isFullPageMode() && isMobile() && !isAuthRoute()"
    class="mobile-footer-container z-50"
  >
    <div
      *ngIf="isMobileWorkspaceTrayOpen()"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40"
      (click)="toggleMobileWorkspaceTray()"
    ></div>

    <div
      *ngIf="isMobileWorkspaceTrayOpen()"
      class="fixed inset-x-4 bottom-24 z-50 rounded-3xl border border-border bg-surface/95 shadow-v42-xl p-4 max-h-[55vh] overflow-y-auto"
    >
      <div class="flex items-center justify-between gap-3 mb-4">
        <div>
          <p
            class="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-primary"
          >
            More Workspaces
          </p>
          <h3 class="text-sm font-black uppercase text-text-main mt-2">
            Jump anywhere
          </h3>
        </div>
        <button
          class="w-9 h-9 rounded-xl border border-border"
          (click)="toggleMobileWorkspaceTray()"
        >
          <span class="material-symbols-outlined text-text-main">close</span>
        </button>
      </div>
      <div class="space-y-2">
        <button
          *ngFor="let workspace of mobileOverflowViews()"
          type="button"
          (click)="navigateToView(workspace.mode)"
          class="flex w-full items-center gap-3 rounded-2xl border border-border px-4 py-3 text-left"
        >
          <span class="material-symbols-outlined text-brand-primary">{{
            workspace.icon
          }}</span>
          <div>
            <div
              class="text-[11px] font-bold uppercase tracking-[0.2em] text-text-main"
            >
              {{ workspace.label }}
            </div>
            <div class="text-[10px] text-text-dim mt-1">
              {{ workspace.description }}
            </div>
          </div>
        </button>
      </div>
    </div>

    <div class="mobile-footer-branding glass-v42 border-t border-border">
      <span class="app-footer-brand footer-brand-global">©️ Smuve Jeff Presents</span>
    </div>

    <nav class="mobile-nav-bar border-t border-border glass-v42">
      <button
        *ngFor="let view of mobilePrimaryViews()"
        type="button"
        (click)="navigateToView(view.mode)"
        class="mobile-nav-button"
      >
        <span class="material-symbols-outlined text-brand-primary">{{
          view.icon
        }}</span>
        <span class="mobile-nav-button-label">{{ view.label }}</span>
      </button>
    </nav>
  </div>
