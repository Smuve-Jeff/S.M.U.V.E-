name: Relay Media Path E2E

# The relay's unit tests mock the media server, so they cannot catch a real
# WebRTC, RTSP or RTMP break. This job runs the end-to-end suite, which publishes
# over WHIP with a Node client, relays through MediaMTX and ffmpeg into an ingest,
# then stops ffmpeg and checks it recovers. It provisions those three tools
# itself, so the job needs no cached binaries and no provider credentials.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'relay/**'
      - 'scripts/relay-e2e.mjs'
      - 'src/app/services/whip-publisher.ts'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/relay-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'scripts/relay-e2e.mjs'
      - 'src/app/services/whip-publisher.ts'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/relay-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: WHIP publish relays to RTMP, stalls, and recovers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The tools are ~80 MB and only change when the provisioning script does
      # (its pinned versions live there), so the key is a hash of that script.
      - name: Cache the media tools
        uses: actions/cache@v4
        with:
          path: node_modules/.e2e
          key: relay-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/relay-e2e.mjs') }}
          restore-keys: |
            relay-e2e-${{ runner.os }}-${{ runner.arch }}-

      # The relay and its tests have no dependencies of their own, so `npm ci` is
      # deliberately skipped: the e2e setup fetches only what it needs (ffmpeg,
      # werift, MediaMTX) into the ignored tool directory.
      - name: Check the relay's own suites
        run: npm run test:relay
        env:
          CI: true

      - name: Provision ffmpeg, MediaMTX, werift and run the media path
        run: npm run test:relay:e2e:setup
        env:
          CI: true
          # The setup step just provisioned all three tools, so a skip here means
          # provisioning did not take — that must fail, not pass quietly.
          RELAY_E2E_REQUIRE_TOOLS: '1'
          RELAY_E2E_LOGS_DIR: ${{ runner.temp }}/relay-e2e-logs

      # A red run has to explain itself: the media server's log and the relay's
      # own decisions are the difference between "the test failed" and a cause.
      - name: Print the media path logs
        if: failure()
        run: |
          dir="${{ runner.temp }}/relay-e2e-logs"
          if [ ! -d "$dir" ]; then
            echo "No diagnostics were written to $dir"
            exit 0
          fi
          for file in "$dir"/*; do
            echo "::group::$(basename "$file")"
            tail -n 200 "$file"
            echo "::endgroup::"
          done

      - name: Upload the media path logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relay-e2e-logs
          path: ${{ runner.temp }}/relay-e2e-logs
          if-no-files-found: warn

  # This job drives the real app bundle in Chromium, so unlike the relay-only
  # job it needs the app's Playwright and esbuild dependencies. Provision only
  # ffmpeg and MediaMTX here; the WHIP-capable ffmpeg is unrelated to this test.
  browser-audio:
    name: Chromium records mixed mic and game audio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium with browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Provision ffmpeg and MediaMTX
        run: npm run test:relay:e2e:setup -- --browser-only --provision-only
        env:
          CI: true

      - name: Run Chromium/MediaMTX recording check
        run: npm run test:relay:e2e:browser
        env:
          CI: true
          # CI just installed every required binary. A skip here means the
          # setup did not take, so it must fail instead of passing quietly.
          RELAY_E2E_REQUIRE_TOOLS: '1'
          RELAY_FFMPEG_PATH: ${{ github.workspace }}/node_modules/.e2e/node_modules/ffmpeg-static/ffmpeg
          MEDIAMTX_PATH: ${{ github.workspace }}/node_modules/.e2e/mediamtx
