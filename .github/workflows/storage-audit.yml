name: Storage Guard Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Every storage access is guarded
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit localStorage and sessionStorage access
        run: npm run audit:storage
