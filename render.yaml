# Render Blueprint — S.M.U.V.E. unified web service (Angular + Express API)
#
# One Render service hosts BOTH the compiled Angular bundle (Build/browser) and
# the Express API (Build/api) through the unified entrypoint src/server.ts, so
# the frontend and API share one origin. window.env derives API_URL from
# location.origin at runtime — no CORS, no separate API hostname.
#
# Deploy steps:
#   1. Push this repo to GitHub.
#   2. In Render: New → Blueprint → connect the GitHub repo.
#   3. Render provisions the web service + Postgres below and deploys.
#   4. Attach the custom domains (smuvejeffpresents.com / www.smuvejeffpresents.com)
#      in the service's Settings → Custom Domains so the app is served same-origin.
#
# Notes:
#   - The free Postgres plan expires after 30 days — upgrade or re-provision
#     for long-lived data.
#   - Free web services sleep after ~15 min of inactivity (wakes on request).

services:
  - type: web
    name: smuve-api
    runtime: node
    plan: free
    rootDir: .
    # install:legacy = npm install --legacy-peer-deps (more tolerant of
    # peer-dep/lockfile drift than strict npm ci for this monorepo).
    buildCommand: npm run install:legacy && npm run build && npm run build:server
    preDeployCommand: npm run mg:run:render
    startCommand: npm run start:unified
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://smuvejeffpresents.com,https://www.smuvejeffpresents.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smuve-postgres
          property: connectionString

databases:
  - name: smuve-postgres
    plan: free
